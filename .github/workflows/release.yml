name: Release

on:
  # Manual trigger from GitHub UI — pick the version bump type
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

  # Also trigger on pushed version tags (e.g. git tag v1.1.0 && git push --tags)
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci
    # Only run on manual dispatch or tag push — not on every CI run
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write # npm provenance + MCP Registry GitHub OIDC login

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Build MCP Server bundle
        run: npm run build:mcp

      # ── Version bump (only on manual dispatch) ──────────────────────────
      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump version in package.json (no git tag yet)
          NEW_VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

          # Also bump mcp-server version to match
          cd mcp-server
          npm version ${{ inputs.bump }} --no-git-tag-version
          # Keep the MCP Registry metadata in lockstep with the npm package
          V="${NEW_VERSION#v}"
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cd ..

          # Claude Code plugin, Gemini extension and .mcp.json pin the npm version; keep them in lockstep
          for f in plugins/gdex/.claude-plugin/plugin.json gemini-extension.json; do
            jq --arg v "$V" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          sed -i -E "s#@gemachdao/gdex-mcp-server@[0-9]+\.[0-9]+\.[0-9]+#@gemachdao/gdex-mcp-server@$V#g" \
            plugins/gdex/.claude-plugin/plugin.json gemini-extension.json .mcp.json plugins/gdex/.mcp.json

          # Commit and tag
          git add package.json package-lock.json mcp-server/package.json mcp-server/package-lock.json mcp-server/server.json plugins/gdex/.claude-plugin/plugin.json gemini-extension.json .mcp.json plugins/gdex/.mcp.json
          git commit -m "chore: release $NEW_VERSION"
          git tag "$NEW_VERSION"
          git push origin main --tags

      # ── Resolve version for tag-push trigger ────────────────────────────
      - name: Get version from tag
        if: github.event_name == 'push'
        id: tag_version
        run: echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      # ── Build release artifacts ─────────────────────────────────────────
      - name: Set release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package SDK tarball
        run: npm pack

      - name: Package MCP Server tarball
        working-directory: mcp-server
        run: npm pack

      # ── Create GitHub Release ───────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            *.tgz
            mcp-server/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish MCP server to npm + MCP Registry ────────────────────────
      - name: Check MCP server versions are in sync
        working-directory: mcp-server
        run: |
          PKG=$(jq -r .version package.json)
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "$v" != "$PKG" ]; then
              echo "::error::mcp-server/server.json version ($v) != package.json version ($PKG)"
              exit 1
            fi
          done
          for f in ../plugins/gdex/.claude-plugin/plugin.json ../gemini-extension.json; do
            if [ "$(jq -r .version "$f")" != "$PKG" ]; then
              echo "::error::$f version != package.json version ($PKG)"
              exit 1
            fi
          done
          if grep -hoE '@gemachdao/gdex-mcp-server@[0-9.]+' ../plugins/gdex/.claude-plugin/plugin.json ../gemini-extension.json ../.mcp.json ../plugins/gdex/.mcp.json | grep -v "@$PKG\$"; then
            echo "::error::an npx pin above does not match package.json version ($PKG)"
            exit 1
          fi
          if [ "$(jq -r .mcpName package.json)" != "$(jq -r .name server.json)" ]; then
            echo "::error::package.json mcpName must equal server.json name"
            exit 1
          fi

      - name: Publish MCP server to npm
        working-directory: mcp-server
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Registry publishing lives in its own workflow so it can wait for npm to serve the new version
  # (npm can take minutes) and can be re-run on its own without bumping the version again.
  mcp-registry:
    name: Publish to MCP Registry
    needs: release
    uses: ./.github/workflows/mcp-registry.yml
    permissions:
      contents: read
      id-token: write # MCP Registry GitHub OIDC login
