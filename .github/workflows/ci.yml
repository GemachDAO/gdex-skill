name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify SDK (offline smoke test)
        run: node scripts/verify.js

  build-mcp-server:
    name: Build MCP Server
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MCP Server bundle
        run: npm run build:mcp

      - name: Ensure committed bundle is up to date
        run: |
          if ! git diff --quiet -- mcp-server/dist/index.js; then
            echo "::error::mcp-server/dist/index.js is stale. Run 'npm run build:mcp' and commit the result (the bundle embeds skills/, so skill edits need a rebuild too)."
            git diff --stat -- mcp-server/dist/index.js
            exit 1
          fi

      # After the stale-bundle check: installing mcp-server deps changes how the bundle resolves.
      - name: Install MCP server dependencies
        run: npm ci --ignore-scripts
        working-directory: mcp-server

      - name: Type-check MCP server
        run: npx tsc --noEmit
        working-directory: mcp-server

      # Includes tests/packedArtifact.test.ts: npm-packs the server, runs it from a temp dir
      # with no skills/ directory and checks the doc tools return bundled content.
      - name: Test MCP server
        run: npm test
        working-directory: mcp-server

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Validate skill definitions
        run: npm run validate

      - name: Ensure plugin skills match skills/
        run: |
          npm run sync:plugin-skills
          if ! git diff --quiet -- plugins/gdex/skills || [ -n "$(git status --porcelain -- plugins/gdex/skills)" ]; then
            echo "::error::plugins/gdex/skills is out of sync with skills/. Run 'npm run sync:plugin-skills' and commit the result."
            git status --short -- plugins/gdex/skills
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
